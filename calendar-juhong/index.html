<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>电子日历 · 市场格局与供应链协同</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC",system-ui,-apple-system,sans-serif;
 background:#EDE9E1;color:#111;display:flex;justify-content:center;
 align-items:center;min-height:100vh}
#gate{text-align:center;padding:48px}
#gate .bar{width:44px;height:11px;background:#D40000;margin:0 auto 18px}
#gate h1{font-size:26px;font-weight:700;letter-spacing:1px;margin-bottom:8px}
#gate p{font-size:12.5px;color:#8A8377;margin-bottom:30px;letter-spacing:.5px}
#gate input{width:250px;padding:12px 16px;border:2px solid #111;font-size:15px;
 outline:none;text-align:center;letter-spacing:3px;background:#F5F3EE}
#gate input:focus{border-color:#D40000}
#gate button{display:block;margin:16px auto 0;padding:10px 38px;background:#111;
 color:#fff;border:none;font-size:13px;font-weight:700;letter-spacing:2px;cursor:pointer}
#gate button:hover{background:#D40000}
#err{color:#D40000;font-size:12.5px;margin-top:14px;height:16px}
#content{display:none;width:100%}

:root{--ink:#111111;--sub:#8A8377;--red:#D40000;--blue:#003082;
 --line:#D8D2C6;--paper:#F5F3EE;--bg:#EDE9E1;--pale:#E4DFD5}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
 font:14px/1.65 "PingFang SC",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;
 -webkit-font-smoothing:antialiased}
button,select{font:inherit;cursor:pointer}
button{color:var(--ink);background:var(--paper);border:1px solid var(--line);
 border-radius:5px;padding:6px 10px;line-height:1.3}
button:hover{background:var(--pale);border-color:#b9b1a2}
button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.page{max-width:1660px;padding:30px 34px 48px;margin:auto}
.topbar{display:flex;align-items:baseline;gap:14px;padding-bottom:10px;
 border-bottom:1px solid var(--line);margin-bottom:26px}
.topbar .brand{font-size:11px;letter-spacing:2.6px;color:var(--red);font-weight:700}
.topbar .sep{color:var(--line)}
.topbar .meta{font-size:11.5px;color:var(--sub);margin-left:auto}
h1{font-size:40px;letter-spacing:-.6px;margin:0;font-weight:700;line-height:1.18}
.subtitle{color:var(--sub);margin:10px 0 24px;max-width:1100px;font-size:13.5px}
.kpilab{font-size:11.5px;color:var(--sub);letter-spacing:.6px;margin:0 0 7px}
.headline{display:flex;align-items:stretch;gap:0;border-top:2px solid var(--ink);
 border-bottom:1px solid var(--line);margin:0 0 4px}
.hl-main{flex:0 0 38%;padding:22px 26px 20px;border-right:1px solid var(--line);
 background:linear-gradient(90deg,rgba(212,0,0,.05),transparent)}
.hl-rank{display:flex;align-items:baseline;gap:12px}
.hl-rank .no{font-size:66px;font-weight:700;color:var(--red);line-height:.92;
 letter-spacing:-3px;font-variant-numeric:tabular-nums}
.hl-rank .txt{font-size:19px;font-weight:700;line-height:1.3}
.hl-rank .txt small{display:block;font-size:12px;color:var(--sub);font-weight:400;
 margin-top:3px;letter-spacing:.3px}
.hl-sub{margin-top:13px;font-size:12.5px;color:#3A352E;line-height:1.7}
.hl-sub b{color:var(--red)}
.hl-traj{display:flex;gap:2px;align-items:flex-end;margin-top:13px;height:34px}
.hl-traj span{flex:1;background:var(--line);border-radius:1px;position:relative;
 min-width:4px}
.hl-trajlab{display:flex;justify-content:space-between;font-size:10px;
 color:var(--sub);margin-top:4px;letter-spacing:.4px}
.hl-traj span.top2{background:var(--red)}
.hl-traj span.now{background:var(--ink)}
.hl-rest{flex:1;display:flex}
.hl-rest .kpi{border-right:1px solid var(--line)}
.hl-rest .kpi:last-child{border-right:0}
.kpis{display:flex;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);margin:0 0 4px}
.kpi{flex:1;padding:15px 20px 14px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
.kl{display:block;font-size:11.5px;color:var(--sub);letter-spacing:.3px}
.kpi strong{display:block;font-size:30px;line-height:1.2;margin:3px 0 2px;
 font-variant-numeric:tabular-nums}
.kpi.red strong{color:var(--red)}.kpi.blue strong{color:var(--blue)}
.kf{display:block;font-size:11.5px;color:var(--sub)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:22px 0 4px;
 position:sticky;top:0;background:var(--bg);z-index:12;padding-top:8px;overflow-x:auto}
.tab{border:0;background:transparent;border-radius:0;padding:11px 18px;font-weight:600;
 font-size:14.5px;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected=true]{border-bottom-color:var(--red);color:var(--red);background:var(--pale)}
.tab:hover{background:var(--pale)}
.tab b{color:var(--sub);font-size:11px;font-weight:600;margin-right:7px;letter-spacing:.6px}
.tab[aria-selected=true] b{color:var(--red)}
.controls{display:flex;align-items:center;gap:13px 22px;flex-wrap:wrap;margin:16px 0 8px}
.control{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:13px}
select,input[type=search]{border:1px solid var(--line);border-radius:5px;padding:6px 9px;
 background:var(--paper);color:var(--ink);min-height:33px;font:inherit}
select{cursor:pointer}
.find{margin-left:auto;display:flex;align-items:center;gap:8px}
.find input{width:230px}
.quiet{background:transparent;border-color:transparent;color:var(--sub);padding:6px 8px}
.scope{display:flex;align-items:flex-start;gap:18px;justify-content:space-between;
 flex-wrap:wrap;margin:0 0 6px;font-size:12px;color:var(--sub)}
.scope strong{color:var(--ink);font-weight:600}
.hit{fill:#D40000!important;font-weight:700!important}
.hitbox{fill:#F5C518;fill-opacity:.35}
.chart-card.dim{display:none}
.chintro{display:flex;gap:16px;align-items:flex-start;margin:30px 0 4px}
.chintro i{flex:0 0 5px;height:46px;background:var(--red);margin-top:3px}
.chintro h2{font-size:25px;margin:0;letter-spacing:-.3px}
.chintro p{margin:5px 0 0;color:var(--sub);font-size:13px}
.note{margin:12px 0 0 19px;padding-left:13px;border-left:3px solid var(--line);
 color:#3A352E;font-size:13.5px;line-height:1.75;max-width:900px}
.chart-card{background:var(--paper);border:1px solid var(--line);border-radius:8px;
 margin:22px 0 40px;overflow:hidden;scroll-margin-top:66px;
 box-shadow:0 1px 3px rgba(40,34,26,.04)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;
 flex-wrap:wrap;padding:9px 16px;background:var(--pale);
 border-bottom:1px solid var(--line)}
.card-title{margin:0;font-size:12.5px;font-weight:600;color:var(--sub);
 display:flex;align-items:center;gap:9px}
.card-title b{color:var(--ink);font-weight:600}
.pill{display:inline-block;padding:1px 8px;border:1px solid var(--line);border-radius:10px;
 font-size:10.5px;color:var(--sub);background:var(--paper)}
.card-actions{display:flex;align-items:center;gap:5px}
.card-actions button{font-size:11.5px;padding:3px 8px;background:var(--paper)}
.zoom-value{font-size:12px;color:var(--sub);min-width:40px;text-align:center;
 font-variant-numeric:tabular-nums}
.chart-viewport{overflow:auto;max-height:none;background:var(--paper);scrollbar-width:thin;scrollbar-color:#c3bbab var(--pale)}
.chart-viewport::-webkit-scrollbar{width:9px;height:9px}
.chart-viewport::-webkit-scrollbar-thumb{background:#c3bbab;border:2px solid var(--paper);border-radius:9px}
.chart-viewport svg{display:block;max-width:none;transform-origin:0 0}
.card-foot{border-top:1px solid var(--line);padding:8px 20px;color:var(--sub);font-size:11px;
 display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.placeholder{border:1px dashed var(--line);border-radius:8px;padding:34px 24px;
 margin:20px 0;text-align:center;color:var(--sub);background:rgba(255,255,255,.3)}
.placeholder b{display:block;font-size:15px;color:var(--ink);margin-bottom:6px;font-weight:600}
.placeholder span{font-size:12.5px}
.notes{font-size:12px;color:var(--sub);margin-top:30px;border-top:1px solid var(--line);padding-top:12px}
.credits{font-size:11px;color:#9a9284;margin-top:16px}
.modal{display:none;position:fixed;inset:0;background:rgba(30,26,20,.35);z-index:500;padding:14px}
.modal.open{display:flex}
.modal-shell{background:var(--paper);border-radius:9px;width:100%;height:100%;overflow:hidden;
 display:flex;flex-direction:column;box-shadow:0 12px 50px rgba(30,26,20,.25)}
.modal-top{padding:10px 16px;background:var(--pale);display:flex;justify-content:space-between;
 align-items:center;border-bottom:1px solid var(--line);font-size:13px;color:var(--sub);gap:12px}
.modal-body{flex:1;overflow:auto;background:var(--paper)}
.modal-body svg{display:block;max-width:none;transform-origin:0 0}
.chart-viewport.fit{max-height:720px}
.hero{margin:26px 0 8px}
.hero .chart-card{margin:16px 0 20px}
.herohead{display:flex;gap:16px;align-items:flex-start;margin:30px 0 4px}
.herohead i{flex:0 0 5px;height:46px;background:var(--red);margin-top:3px}
.herohead h2{font-size:25px;margin:0;letter-spacing:-.3px}
.herohead p{margin:5px 0 0;color:var(--sub);font-size:13px}
@media(max-width:780px){.page{padding:18px 12px}h1{font-size:22px}
 .kpis{flex-wrap:wrap}.kpi{flex:1 1 50%;border-bottom:1px solid var(--line)}
 .tab{padding:10px 13px;font-size:13.5px}}
@media print{.tabs,.card-actions,.modal{display:none!important}
 .page{padding:0;max-width:none}body{background:#fff}
 .chart-viewport{max-height:none;overflow:visible}
 .chart-card{break-inside:avoid;border:0;background:#fff}
 .panel{display:block!important}}

</style></head><body>

function unlock(){
  const p=document.getElementById("pw").value;
  crypto.subtle.digest("SHA-256",new TextEncoder().encode(p)).then(b=>{
    const hex=Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");
    if(hex===H){
      document.getElementById("gate").style.display="none";
      const c=document.getElementById("content");
      c.style.display="block";
      c.innerHTML=decodeURIComponent(escape(atob(D)));
      document.body.style.cssText="background:#EDE9E1;display:block";
      [...c.querySelectorAll("script")].forEach(s=>{
        const n=document.createElement("script");n.textContent=s.textContent;
        document.body.appendChild(n);
      });
      sessionStorage.setItem("ok","1");
    } else {
      document.getElementById("err").textContent="密码不对";
      document.getElementById("pw").value="";
    }
  });
}
